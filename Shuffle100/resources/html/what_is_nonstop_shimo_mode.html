<title>ノンストップ（下の句のみ）</title>
<link rel="stylesheet" href="helpStyle.css">
</head>

<body>

<h3>ノンストップ（下の句のみ）とは？</h3>
<blockquote>
  <p class="NormalMincho">上の句を読まず、選んだ歌の<strong>下の句だけ</strong>を、最後の歌まで自動で読み続けるモードです。</p>
  <p class="NormalMincho">読み上げを途中で止めたいときは、ポーズボタンを押してください。</p>
  <p>&nbsp;</p>
</blockquote>

<h3>「下の句かるた（北海道式）」との違い</h3>
<blockquote>
  <p class="NormalMincho">「下の句かるた（北海道式）」では、1首を読むたびに「次はどうする？」画面が表示されます。</p>
  <p class="NormalMincho">「ノンストップ（下の句のみ）」ではその画面を表示せず、最後まで自動的に進みます。また、次の歌へ進む前に直前の下の句を繰り返しません。</p>
  <p>&nbsp;</p>
</blockquote>

<h3>空札の扱い</h3>
<blockquote>
  <p class="NormalMincho">トップ画面の「空札を加える」をオンにすると、空札を加えて読み上げることができます。</p>
  <p>&nbsp;</p>
</blockquote>

</body>
</html>
